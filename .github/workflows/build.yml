name: Derle (Windows + macOS)

# Çalıştırma yolları:
#  1) Actions sekmesinden "Run workflow"  → dosyalar Artifacts bölümüne gelir
#  2) v ile başlayan bir etiket (tag) gönderildiğinde (ör. v1.2.0)
#     → dosyalar "Releases" sayfasında yayınlanır; uygulamalar güncellemeyi buradan alır

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - name: Paketle
        run: npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Yanki-Windows
          path: |
            dist/*.exe
            dist/*.zip

  mac:
    name: macOS (.dmg + .zip)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - name: Paketle
        run: npx electron-builder --mac --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: Yanki-macOS
          path: |
            dist/*.dmg
            dist/*.zip

  release:
    name: İndirme sayfası (Release)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sürüm notları
        run: node scripts/release-notes.js "${{ github.ref_name }}" > notes.md
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: YANKI ${{ github.ref_name }}
          body_path: notes.md
          files: out/*
